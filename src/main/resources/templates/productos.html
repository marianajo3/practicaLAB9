<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Productos · Lab 1806</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>
<body>
    <nav class="navbar">
        <a th:href="@{/}" class="brand">🧪 Lab 1806</a>
        <div>
            <a th:href="@{/}">Inicio</a>
            <a th:href="@{/productos}">Productos</a>
            <a th:href="@{/productos/nuevo}">Nuevo</a>
        </div>
    </nav>

    <main>
        <h1>📦 Listado de productos</h1>
        <p><a th:href="@{/productos/nuevo}" class="btn">➕ Nuevo producto</a></p>

        <table id="tablaProductos">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Nombre</th>
                    <th>Precio</th>
                    <th>Stock</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody>
                <tr th:if="${#lists.isEmpty(productos)}">
                    <td colspan="5" class="muted">No hay productos todavía.</td>
                </tr>
                <tr th:each="p : ${productos}">
                    <td th:text="${p.id}">1</td>
                    <td th:text="${p.nombre}">…</td>
                    <td th:text="'S/ ' + ${#numbers.formatDecimal(p.precio, 1, 2)}">0.00</td>
                    <td th:text="${p.stock}">0</td>
                    <td>
                        <a th:href="@{|/productos/${p.id}/editar|}" class="btn-secondary btn-sm">Editar</a>
                        <form th:action="@{|/productos/${p.id}/eliminar|}" method="post" style="display:inline"
                              th:attr="data-id=${p.id}"
                              onsubmit="return confirm('¿Eliminar producto ' + this.dataset.id + '?');">
                            <button type="submit" class="btn-del">Eliminar</button>
                        </form>
                    </td>
                </tr>
            </tbody>
        </table>

        <h3>🧪 Probar endpoints JSON con jQuery</h3>
        <button class="btn-test" data-endpoint="/api/mensaje/publico">GET /api/mensaje/publico</button>
        <button class="btn-test" data-endpoint="/api/mensaje/privado">GET /api/mensaje/privado</button>
        <button class="btn-test" data-endpoint="/api/mensaje/admin">GET /api/mensaje/admin</button>
        <pre id="testOutput" class="output">— las respuestas aparecerán aquí —</pre>
    </main>

    <script th:src="@{/js/api.js}"></script>
    <script th:src="@{/js/app.js}"></script>
</body>
</html>
